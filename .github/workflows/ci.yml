name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
      - name: Backend
        working-directory: backend
        run: |
          uv sync
          uv run ruff check redlark tests
          uv run pytest -q

  desktop:
    # Windows installer, attached to GitHub releases (tag v2.*).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm ci && npm run build
        working-directory: frontend
      - run: |
          uv sync --extra desktop
          uv run pyinstaller packaging/redlark.spec --noconfirm --distpath dist --workpath build
          choco install innosetup -y --no-progress
          iscc /DVersion=${{ github.ref_name }} packaging/installer.iss
        working-directory: backend
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Redlark-Setup-*.exe
          draft: true
