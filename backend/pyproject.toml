[project]
name = "redlark"
version = "2.0.0a1"
description = "Worship set planning: OpenSong/ChordPro song library, sets, and exports."
authors = [{ name = "Derek Schaper" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "playwright>=1.45",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.1", "pyinstaller>=6.8"]

[project.scripts]
redlark = "redlark.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redlark"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI's Depends()/File() defaults are idiomatic.  B904: HTTPException re-raise without "from".
ignore = ["B008", "B904", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
